# Task 1: LLM fine-tuning, adaptation and retention.
# Every value below is taken from the PA3 manual unless marked "(impl)", which marks an
# implementation/engineering choice that does not change the prescribed experiment.

seed: 6304
model_name: "Qwen/Qwen3-0.6B"
model_revision: "main"              # (impl) resolved commit hash is recorded in every run manifest
enable_thinking: false

data:
  dataset: "meta-math/MetaMathQA"
  n_train: 40000                    # first 40,000 eligible examples, source order, no shuffling
  max_seq_length: 2048              # exclude examples whose formatted length exceeds this
  train_file: "data/metamathqa_train_40k.jsonl"
  token_file: "data/metamathqa_train_40k_tokens.pt"   # (impl) tokenized once, reused by all 5 runs
  probe_file: "data/activation_probe_set.json"
  n_probe_gsm8k: 32
  n_probe_hellaswag: 32

train:
  microbatch: 2
  grad_accum: 16                    # effective batch 32
  total_updates: 1250               # 40,000 examples, one epoch
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01                # biases and <2-D parameters excluded
  warmup_updates: 38                # then cosine decay
  grad_clip: 1.0
  gradient_checkpointing: true
  checkpoint_updates: [312, 625, 937, 1250]   # 9,984 / 20,000 / 29,984 / 40,000 examples
  midpoint_update: 625
  final_update: 1250
  log_every: 10                     # (impl) console logging cadence; every update is stored in the JSON log
  displacement_every: 25            # (impl) Full FT / L2-SP displacement trace resolution
  ce_chunk_tokens: 1024             # (impl) chunked lm_head + CE; mathematically identical, saves ~3 GB
  l2sp_reference_device: "cpu"      # (impl) theta_0 kept in pinned CPU RAM (T4 has 16 GB)

methods:
  full_ft:    {type: full,   lr: 2.0e-5, lambda_l2sp: 0.0}
  l2sp:       {type: full,   lr: 2.0e-5, lambda_l2sp: 1.0e-3}
  lora_r4:    {type: lora,   lr: 2.0e-4, r: 4,  alpha: 8}
  lora_r16:   {type: lora,   lr: 2.0e-4, r: 16, alpha: 32}
  oplora_r16: {type: oplora, lr: 2.0e-4, r: 16, alpha: 32, k: 128}

adapters:
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

eval:
  mc_tasks: ["hellaswag", "boolq", "arc_easy"]
  gen_task: "gsm8k_cot"
  expected_docs: {gsm8k_cot: 1319, hellaswag: 10042, boolq: 3270, arc_easy: 2376}
  gsm8k_max_gen_toks: 1024
  mc_batch_size: 32                 # (impl) fixed across all conditions
  gen_batch_size: 32                # (impl) fixed across all conditions
  qualitative_file: "first_plot_questions.yaml"
  qualitative_max_new_tokens: 512
  annotation_questions: ["what_is_your_wish", "enough_of_my_husband"]  # first & last plain questions

diagnostics:
  layers: [0, 13, 27]               # zero-based down_proj layers
  k: 128
